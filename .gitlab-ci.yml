---
stages:
  - install
  - build
  - container
  - post

variables:
  GO_VERSION: 1.25-alpine
  CONTAINER_IMAGE_NAME: cenk1cenk2/nginx-ingress

include:
  - project: devops/pipelines
    ref: go@1.6.0
    file:
      - /go/install.gitlab-ci.yml
      - /go/lint.gitlab-ci.yml
      - /go/build.gitlab-ci.yml
    inputs:
      version: 1.25-alpine
  - project: devops/pipelines
    ref: buildah@1.2.2
    file:
      - /buildah/build.gitlab-ci.yml
      - /buildah/manifest.gitlab-ci.yml
      - /buildah/registry-dockerhub.gitlab-ci.yml
  - project: devops/pipelines
    ref: docker@1.1.0
    file:
      - /docker/update-docker-hub-readme.gitlab-ci.yml

install:
  stage: install
  extends:
    - .go-install

lint:
  stage: build
  extends:
    - .go-lint

build:
  stage: build
  variables:
    GO_BUILD_LINKER: -w -s
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_TARGETS: |-
      - os: linux
        arch: amd64
    GO_BUILD_VARIABLES: |-
      main.VERSION: '{{ now | date "2006-01-02T15:04:05Z0700" }}'
  extends:
    - .go-build

container:
  stage: container
  extends: .container-build
  parallel:
    matrix:
      - CONTAINER_FILE_NAME: Dockerfile
        CONTAINER_IMAGE_TAGS: latest-${GITLAB_CI_ARCH}
        CONTAINER_MANIFEST_TARGET: latest
        GITLAB_CI_ARCH:
          - amd64
  needs:
    - job: lint
      artifacts: false
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"

manifest:
  stage: post
  extends: .container-manifest
  needs:
    - job: container
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"

update-docker-hub-readme:
  stage: post
  extends: .update-docker-hub-readme
  variables:
    README_DESCRIPTION: |
      A very basic and dirty supervisor for multiple tasks running inside a Docker container.
  needs:
    - job: container
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"

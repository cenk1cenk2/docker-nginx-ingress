---
stages:
  - install
  - build
  - version
  - container
  - post

variables:
  GO_VERSION: 1.27-alpine
  CONTAINER_IMAGE_NAME: docker.io/cenk1cenk2/nginx-ingress

include:
  - project: devops/pipelines
    ref: go@2.2.2
    file:
      - /go/install.gitlab-ci.yml
      - /go/lint.gitlab-ci.yml
      - /go/build.gitlab-ci.yml
    inputs:
      version: 1.27-alpine
  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml
  - project: devops/pipelines
    ref: buildah@2.3.0
    file:
      - /buildah/build.gitlab-ci.yml
      - /buildah/manifest.gitlab-ci.yml
      - /buildah/registry-dockerhub.gitlab-ci.yml
  - project: devops/pipelines
    ref: docker@2.0.1
    file:
      - /docker/update-docker-hub-readme.gitlab-ci.yml
  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml

install:
  stage: install
  extends:
    - .go-install

lint:
  stage: build
  extends:
    - .go-lint

build:
  stage: build
  variables:
    GO_BUILD_LINKER: -w -s
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_TARGETS: |-
      - os: linux
        arch: amd64
    GO_BUILD_VARIABLES: |-
      main.VERSION: '{{ env "CI_COMMIT_TAG" | default (printf "BUILD.%s" (now | date "2006-01-02T15:04:05Z0700")) }}'
  extends:
    - .go-build

version:
  stage: version
  extends:
    - .semantic-release
  needs:
    - lint
    - job: build
      artifacts: false
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never

container:
  stage: container
  extends: .container-build
  variables:
    CONTAINER_IMAGE_TAGS: latest-${GITLAB_CI_ARCH}
    CONTAINER_MANIFEST_TARGET: latest
  parallel:
    matrix:
      - CONTAINER_FILE_NAME: Dockerfile
        GITLAB_CI_ARCH:
          - amd64
  needs:
    - job: lint
      artifacts: false
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
      variables:
        CONTAINER_IMAGE_TAGS: ${CI_COMMIT_TAG}-${GITLAB_CI_ARCH}
        CONTAINER_MANIFEST_TARGET: $CI_COMMIT_TAG

manifest:
  stage: post
  extends: .container-manifest
  needs:
    - job: container
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
      variables:
        CONTAINER_MANIFEST_TARGET: $CI_COMMIT_TAG

update-docker-hub-readme:
  stage: post
  extends: .update-docker-hub-readme
  variables:
    README_DESCRIPTION: |
      A very basic and dirty supervisor for multiple tasks running inside a Docker container.
  needs:
    - job: container
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule"
